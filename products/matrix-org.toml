]

[rubric.security]
value = "yes"
citations = [
  "\"We never store password data in plain text; instead they are stored hashed (with at least 4096 rounds of bcrypt, including both a salt and a server-side pepper secret). Passwords sent to the server are encrypted using SSL.\n\nIt is your sole responsibility to keep your user name, password and other sensitive information confidential. Actions taken using your credentials shall be deemed to be actions taken by you, with all consequences including service termination, civil and criminal penalties.\""
]

[rubric.third-party-access]
value = "yes-specified-noncritical"
citations = [
  "\"Big Cartel\nDonorbox\nPretix\nPretalx\nWe need to collect additional information on your account to manage paid plans. This is essentially a flag to identify your account as being on a free or paid plan. Payment details are processed by Stripe. Additionally, we use Xero to automate our tax obligations. [...]\n\nWe may share your information when working with our suppliers in order to provide the Service.\n\nIn addition, the Matrix.org homeserver is a decentralised and open service. This means that, to support communication between users on different homeservers or different messaging platforms, your username, display name and messages and files are sometimes shared with other services that are connected with the Matrix.org homeserver.\""
]

